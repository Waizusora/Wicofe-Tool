name: Repository validation tool tests

on:
  push:
    paths:
      - "scripts/**"
      - "tests/**"
      - "config/**"
      - ".github/workflows/repository-docs-validator.yml"
  pull_request:
    paths:
      - "scripts/**"
      - "tests/**"
      - "config/**"
      - ".github/workflows/repository-docs-validator.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - name: Run validator unit tests
        run: python -m unittest discover -s tests -v
