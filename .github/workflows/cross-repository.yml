name: Cross-Repository Baseline

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-baseline:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Wicofe-Tool
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: Wicofe-Tool
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Check out project repositories
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p workspace
          while IFS= read -r repo; do
            [ -n "$repo" ] || continue
            git clone --depth 1 "https://github.com/Waizusora/$repo.git" "workspace/$repo"
          done < <(python -c 'import json; print("\n".join(json.load(open("Wicofe-Tool/config/repositories.json", encoding="utf-8"))["repositories"]))')
      - name: Validate repository baseline
        run: >-
          python Wicofe-Tool/scripts/check_repository_matrix.py
          --manifest Wicofe-Tool/config/repositories.json
          --workspace workspace
