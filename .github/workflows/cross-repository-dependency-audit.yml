name: Cross-repository dependency license audit

on:
  workflow_call:
    inputs:
      tools_ref:
        required: false
        type: string
        default: main
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Wicofe-Tool
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: Waizusora/Wicofe-Tool
          ref: ${{ inputs.tools_ref }}
          path: Wicofe-Tool
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - name: Check out all 29 project repositories
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p workspace
          while IFS= read -r repo; do
            [ -n "$repo" ] || continue
            git clone --depth 1 "https://github.com/Waizusora/$repo.git" "workspace/$repo"
          done < <(python -c 'import json; print("\n".join(json.load(open("Wicofe-Tool/config/repositories.json", encoding="utf-8"))["repositories"]))')
      - name: Verify canonical repository set
        run: |
          python Wicofe-Tool/scripts/check_repository_matrix.py \
            --manifest Wicofe-Tool/config/repositories.json \
            --workspace workspace
      - name: Generate repository dependency manifest coverage report
        run: |
          python Wicofe-Tool/scripts/report_manifest_coverage.py \
            --manifest Wicofe-Tool/config/repositories.json \
            --workspace workspace \
            --json reports/manifest-coverage.json \
            --markdown reports/manifest-coverage.md
      - name: Resolve and audit every repository
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p reports/dependencies reports/cargo-metadata
          failed=0
          while IFS= read -r repo; do
            [ -n "$repo" ] || continue
            root="workspace/$repo"
            args=(--workspace "$root" --repository "$repo"
              --decisions Wicofe-Tool/config/dependency_license_decisions.example.json
              --evidence Wicofe-Tool/config/upstream_license_evidence.json
              --coverage Wicofe-Tool/config/repository_dependency_coverage.example.json
              --strict --json "reports/dependencies/$repo.json"
              --markdown "reports/dependencies/$repo.md")
            mapfile -d '' manifests < <(
              find "$root" -type f -name Cargo.toml \
                -not -path '*/.git/*' \
                -not -path '*/target/*' \
                -not -path '*/node_modules/*' \
                -not -path '*/.venv/*' -print0 | sort -z
            )
            index=0
            for manifest in "${manifests[@]}"; do
              index=$((index + 1))
              for feature_mode in default all-features; do
                metadata="reports/cargo-metadata/$repo-$index-$feature_mode.json"
                cargo_args=(metadata --format-version 1 --manifest-path "$manifest")
                if [ "$feature_mode" = "all-features" ]; then
                  cargo_args+=(--all-features)
                fi
                # Without a committed lockfile Cargo creates a transient audit-only lockfile.
                if cargo "${cargo_args[@]}" > "$metadata"; then
                  args+=(--cargo-metadata "$metadata")
                else
                  echo "BLOCKED: Cargo metadata resolution failed: $repo / $manifest / $feature_mode"
                  failed=1
                fi
              done
            done
            echo "::group::Dependency audit: $repo"
            python Wicofe-Tool/scripts/audit_dependencies.py "${args[@]}" || failed=1
            echo "::endgroup::"
            if [ -d "$root" ]; then
              while IFS= read -r -d '' lockfile; do
                relative="${lockfile#"$root"/}"
                mkdir -p "reports/cargo-metadata/$repo-lockfiles/$(dirname "$relative")"
                cp "$lockfile" "reports/cargo-metadata/$repo-lockfiles/$relative"
              done < <(find "$root" -type f -name Cargo.lock -not -path '*/.git/*' -not -path '*/target/*' -print0)
            fi
          done < <(python -c 'import json; print("\n".join(json.load(open("Wicofe-Tool/config/repositories.json", encoding="utf-8"))["repositories"]))')
          if [ "$failed" -ne 0 ]; then
            echo "BLOCKED: one or more repositories have unresolved or unapproved dependencies."
            exit 1
          fi
      - name: Upload cross-repository audit evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: wicofe-cross-repository-dependency-audit
          path: |
            reports/manifest-coverage.json
            reports/manifest-coverage.md
            reports/dependencies/
            reports/cargo-metadata/
          if-no-files-found: warn
