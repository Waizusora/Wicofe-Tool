name: Dependency license audit

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Resolve Cargo dependency graph
        run: |
          mkdir -p reports
          if [ -f Cargo.toml ]; then
            cargo metadata --format-version 1 --locked > reports/cargo-metadata.json
          fi
      - name: Generate dependency inventory and enforce policy
        run: |
          set -- --workspace . --repository Wicofe-Tools \
            --decisions config/dependency_license_decisions.example.json \
            --evidence config/upstream_license_evidence.json \
            --json reports/dependency-audit.json \
            --markdown reports/DEPENDENCY_LICENSE_AUDIT.md
          if [ -f reports/cargo-metadata.json ]; then
            set -- "$@" --cargo-metadata reports/cargo-metadata.json
          fi
          python3 scripts/audit_dependencies.py "$@"
      - name: Upload audit reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: dependency-license-audit
          path: |
            reports/dependency-audit.json
            reports/DEPENDENCY_LICENSE_AUDIT.md
